<script>/* apply the saved theme before first paint (default: light) */

<style>
/* ---------- Light theme (default): warm cream palette, same as the Achievers dashboard ---------- */
:root,[data-theme=light]{color-scheme:light;--bg0:#fbf6ec;--bg1:#f5eddd;--glow:rgba(38,119,255,.1);--panel:rgba(255,253,248,.94);--p2:#fffdf8;--line:rgba(40,78,130,.2);--l2:rgba(40,78,130,.11);--soft:rgba(31,95,209,.07);--cyan:#0a82c4;--blue:#1f5fd1;--text:#1d2733;--muted:#5d6b78;--faint:#8a95a0;--green:#17875c;--greenbg:rgba(23,135,92,.1);--amber:#a86300;--amberbg:rgba(214,140,20,.13);--red:#c93048;--redbg:rgba(201,48,72,.09);--purple:#6b4bd6;--purplebg:rgba(107,75,214,.1);
 --in:#fffdf8;--inbd:#d8cdb8;--indis:#f1eadc;--indistx:#9a9486;--lbl:#3b4a58;--chip:#f3ebdc;--ctx:#234a73;--btn2:#fffaf1;--btn2tx:#4a5a6a;--hovtx:#0b3d73;--link:#1f5fd1;--banner:#7a4800;--track:rgba(29,39,51,.09);--sh:rgba(90,70,40,.1);--shl:rgba(60,45,20,.22);--th:#f3ebdc;--thtx:#1c4f86;--hovrow:rgba(31,95,209,.05);--overlay:rgba(40,30,15,.42);--toast:#fffdf8;--tx2:#3b4a58;--head:#1c4f86;--inset:rgba(251,246,236,.75);--focus-a:rgba(31,95,209,.10);--focus-b:rgba(255,253,248,.96);--neg:#d22e49;
 --ch-ax:#6b7a88;--ch-ax2:#8a95a0;--ch-grid:rgba(60,80,110,.12);--ch-grid0:rgba(60,80,110,.35);--ch-pct:#6d4fc4;--ch-pct2:#8a72cf;--ch-pct-line:rgba(109,79,196,.45);--ch-res:#1463b8;--ch-pen:#b86200;--ch-nodata:#b4ab9a;--ch-mon:#4a5a6a;--ch-mon-sel:#1d2733;--ch-mon-na:#b0a898;--ch-pt:#fffdf8;--ch-pill:rgba(255,253,248,.96);--ch-pill-tx:#4b2fa3;--ch-band:rgba(31,95,209,.06);--ch-band-bd:rgba(31,95,209,.25);
 --glass-rim:rgba(255,255,255,.95);--glass-edge:rgba(90,110,140,.40);--glass-floor:rgba(90,110,140,.06);--glass-floor-bd:rgba(90,110,140,.28)}
/* ---------- Dark theme: deep navy ---------- */
[data-theme=dark]{color-scheme:dark;--bg0:#02050b;--bg1:#07111f;--glow:#12345d;--panel:rgba(12,24,43,.88);--p2:rgba(9,19,35,.92);--line:rgba(83,190,255,.22);--l2:rgba(83,190,255,.12);--soft:rgba(91,192,255,.1);--cyan:#34c5ff;--blue:#2677ff;--text:#eef8ff;--muted:#8da7bd;--faint:#6f879b;--green:#4bd39a;--greenbg:rgba(28,124,94,.2);--amber:#ffc970;--amberbg:rgba(143,83,0,.24);--red:#ff7081;--redbg:rgba(138,55,65,.26);--purple:#b9a6e8;--purplebg:rgba(107,75,214,.22);
 --in:#07101f;--inbd:#29445f;--indis:#0a1421;--indistx:#60778b;--lbl:#bdd3e5;--chip:#0a1a2d;--ctx:#bfe8ff;--btn2:#081321;--btn2tx:#aac1d3;--hovtx:#fff;--link:#7dd4ff;--banner:#ffe2b3;--track:rgba(255,255,255,.07);--sh:rgba(0,0,0,.3);--shl:rgba(0,0,0,.45);--th:#0b1a2c;--thtx:#bfe8ff;--hovrow:rgba(52,197,255,.05);--overlay:rgba(0,0,0,.72);--toast:#0d1d33;--tx2:#c9dbe8;--head:#c8edff;--inset:rgba(7,16,31,.45);--focus-a:rgba(23,87,187,.28);--focus-b:rgba(12,24,43,.9);--neg:#ff5c72;
 --ch-ax:#8da7bd;--ch-ax2:#6f879b;--ch-grid:rgba(141,167,189,.12);--ch-grid0:rgba(141,167,189,.35);--ch-pct:#b9a6e8;--ch-pct2:#8c7bbd;--ch-pct-line:rgba(177,140,255,.45);--ch-res:#7fd9ff;--ch-pen:#ffc970;--ch-nodata:#3d5468;--ch-mon:#aac1d3;--ch-mon-sel:#eef8ff;--ch-mon-na:#4f6679;--ch-pt:#07101f;--ch-pill:rgba(7,16,31,.92);--ch-pill-tx:#e6dcff;--ch-band:rgba(52,197,255,.06);--ch-band-bd:rgba(52,197,255,.25);
 --glass-rim:rgba(255,255,255,.75);--glass-edge:rgba(255,255,255,.55);--glass-floor:rgba(255,255,255,.04);--glass-floor-bd:rgba(255,255,255,.22)}
html.theme-anim,html.theme-anim *{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{min-height:100vh;background:radial-gradient(circle at 18% 0,var(--glow),transparent 34%),linear-gradient(145deg,var(--bg0),var(--bg1) 58%,var(--bg0));background-attachment:fixed;color:var(--text);font:14px/1.5 Manrope,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--inbd);border-radius:10px;background:var(--in);color:var(--text);outline:0}
select option{background:var(--in);color:var(--text)}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(52,197,255,.14)}
select:disabled,input:disabled{background:var(--indis);color:var(--indistx)}
h1,h2,h3{margin:0}h2{font-size:16px;font-weight:800}.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.lbl{display:block;font-size:12px;font-weight:600;margin:0 0 5px;color:var(--lbl)}
/* ---------- sign in ---------- */
.card{width:min(460px,calc(100% - 32px));margin:7vh auto 40px;padding:22px 30px 28px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px var(--shl),0 0 0 1px rgba(52,197,255,.05),0 0 40px rgba(52,197,255,.08);backdrop-filter:blur(16px)}
.logo{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 12px 30px var(--shl),0 0 26px rgba(40,183,255,.18);margin:4px 0 16px;user-select:none}
.card h1{font-size:17px;font-weight:700;text-align:center}.card>.sub{text-align:center}
.card .lbl{margin-top:14px}
.pri{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 8px 24px rgba(38,119,255,.28)}.pri:hover:not(:disabled){filter:brightness(1.08)}
.gh{border:1px solid var(--line);background:var(--p2);border-radius:10px;padding:7px 12px}.gh:hover:not(:disabled){border-color:var(--cyan)}
.lk{background:none;border:0;padding:4px 0;color:var(--link);font-size:13px}.lk:hover{text-decoration:underline}
.msg{min-height:1.3em;margin:12px 0 0;font-size:13px;color:var(--red)}.msg.ok{color:var(--green)}
.pw{position:relative}.pw input{padding-right:58px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--link);font-size:12px;padding:6px}
.caps{font-size:12px;color:var(--amber);margin-top:4px}.hint{font-size:12px;color:var(--muted);margin-top:4px}
/* ---------- theme toggle ---------- */
.theme-toggle{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--p2);color:var(--muted);font:600 12px/1 Manrope,sans-serif;box-shadow:0 4px 14px var(--sh);white-space:nowrap}
.theme-toggle:hover{border-color:var(--cyan)}.theme-toggle .o{display:inline-flex;align-items:center;gap:4px;opacity:.55}.theme-toggle em{font-style:normal}
.theme-toggle .tr{position:relative;width:38px;height:20px;border-radius:999px;background:linear-gradient(90deg,#ffd46b,#ffb238);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.theme-toggle .kn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.4,.2,.2,1)}
[data-theme=light] .theme-toggle .sun,[data-theme=dark] .theme-toggle .moon{opacity:1;color:var(--text)}
[data-theme=dark] .theme-toggle .tr{background:linear-gradient(90deg,#3056c9,#6b4fd8)}[data-theme=dark] .theme-toggle .kn{transform:translateX(18px)}
.theme-fixed{position:fixed;top:14px;right:16px;z-index:45}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px clamp(12px,2vw,32px);background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 10px 35px var(--sh);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:52px;height:52px;object-fit:cover;flex:none;border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 16px var(--sh);user-select:none}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.01em;white-space:nowrap}.brand h1 span{color:var(--cyan)}
.ua{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.user-meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.35;margin-right:6px}.user-meta b{display:block;color:var(--text);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--ctx);white-space:nowrap}
.chip.g{background:var(--greenbg);color:var(--green);border-color:rgba(75,211,154,.35)}.chip.b{background:var(--amberbg);color:var(--amber);border-color:rgba(255,201,112,.35)}.chip.r{background:var(--redbg);color:var(--red);border-color:rgba(255,112,129,.35)}.chip.p{background:var(--purplebg);color:var(--purple)}.chip.n{color:var(--muted)}
/* ---------- layout + left pane ---------- */
.lay{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:16px clamp(12px,2vw,32px) 60px}
.side{display:grid;gap:6px;align-content:start;position:sticky;top:90px;height:max-content}
.nv{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--p2);font-weight:700;font-size:13px;width:100%}
.nv:hover{border-color:var(--cyan);color:var(--hovtx)}.nv .ic{width:18px;text-align:center;flex:none}.nv .cv{margin-left:auto;transition:transform .2s;opacity:.7}
.nv[aria-expanded=true] .cv{transform:rotate(90deg)}
.nv.sub{margin-left:16px;width:calc(100% - 16px);font-weight:600;font-size:12.5px;padding:8px 12px}
.nv.on{color:#fff;background:linear-gradient(90deg,#1757bb,#168cc7);border-color:#4bcaff;box-shadow:0 0 14px rgba(52,197,255,.2)}
.nv.grp-on{border-color:var(--cyan)}
.subs{display:grid;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 38px var(--sh);margin-bottom:14px;backdrop-filter:blur(14px)}
.block-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 10px;flex-wrap:wrap}
/* ---------- filters ---------- */
.filters{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.months{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:6px}
.mo{border:1px solid var(--line);background:var(--btn2);color:var(--btn2tx);border-radius:10px;padding:7px 8px;font-weight:700;font-size:12px}
.mo:hover:not(:disabled){border-color:var(--cyan);color:var(--hovtx)}.mo:disabled{opacity:.35}
.mo.on{background:linear-gradient(90deg,#1757bb,#168cc7);color:#fff;border-color:#4bcaff;box-shadow:0 0 14px rgba(52,197,255,.25)}
.hier{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.hier:empty{display:none}
.hier .lock select{border-style:dashed}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}.crumbs:empty{display:none}
.crumbs button{border:0;background:none;color:var(--link);padding:2px 4px;border-radius:6px}.crumbs button:hover{background:var(--soft)}
.crumbs .sep{color:var(--faint)}.crumbs .cur{color:var(--text);font-weight:700;padding:2px 4px}
.sel-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:7px 12px;border-radius:10px;font-size:12.5px;background:var(--amberbg);border:1px solid rgba(214,140,20,.35);color:var(--banner)}
.sel-note button{border:0;background:none;color:var(--link);font-weight:700;padding:2px 4px;margin-left:auto}.sel-note button:hover{text-decoration:underline}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.act:empty{display:none}
/* ---------- hero + KPIs ---------- */
.focus{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--focus-a),var(--focus-b) 55%)}
.focus h2{font-size:24px;letter-spacing:-.01em;margin:2px 0 6px}.focus .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero-n{display:grid;grid-template-columns:repeat(2,minmax(130px,auto));gap:10px}
.hero-n div{background:var(--p2);border:1px solid var(--l2);border-radius:12px;padding:10px 14px;text-align:right}.hero-n span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}.hero-n b{font-size:20px;font-weight:800}.hero-n small{display:block;font-size:11.5px;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{position:relative;background:var(--p2);border:1px solid var(--l2);border-radius:12px;padding:12px 14px;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.good:before{background:var(--green)}.kpi.warn:before{background:var(--amber)}.kpi.bad:before{background:var(--red)}.kpi.info:before{background:var(--cyan)}.kpi.pur:before{background:var(--purple)}
.kpi span{display:block;color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;margin:3px 0 1px}.kpi small{color:var(--faint);font-size:11.5px}
.g2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.g2>.panel{min-width:0}
.mini-h{font-size:12.5px;font-weight:700;color:var(--head);margin:12px 0 6px}
/* ---------- charts (Achievers style) ---------- */
.trend-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:4px 0 6px;font-size:12.5px;color:var(--tx2)}
.trend-legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:7px;vertical-align:-2px}
.sw.res{background:linear-gradient(180deg,#5fd6ff,#1757bb)}.sw.pen{background:linear-gradient(180deg,#ffd27a,#ff7a18)}.sw.pct{height:4px!important;border-radius:4px;width:22px!important;vertical-align:3px!important;background:linear-gradient(90deg,#4bd39a,#b18cff)}
.trend-chart{overflow-x:auto;margin:0 -4px}.trend-chart svg{display:block;min-width:720px;width:100%;height:auto}
.trend-chart g.mo2:hover rect.tb{opacity:.82}.trend-chart .hit{fill:transparent;cursor:pointer}
.hbars{display:grid;gap:4px;margin-top:6px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:12.5px;padding:5px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.hbar:hover{background:var(--soft)}.hbar.on{background:var(--soft);border-color:var(--cyan)}
.hbar .t{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:9px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%}
.bar i.res{background:linear-gradient(90deg,var(--blue),var(--cyan))}.bar i.pen{background:linear-gradient(90deg,#d98a0b,#ffbb3d)}
.paid-grid{display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(300px,1fr);gap:16px;align-items:center;background:var(--inset);border:1px solid var(--l2);border-radius:12px;padding:12px 14px}.paid-grid>*{min-width:0}
.pie3d svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.pie3d .ptop,.pie3d .pwall{transition:filter .15s}.pie3d .ptop:hover,.pie3d .pwall:hover{filter:brightness(1.18) saturate(1.1)}
.plab{fill:var(--c0)}.plab-l{stroke:var(--c0)}[data-theme=light] .plab{fill:var(--c2)}[data-theme=light] .plab-l{stroke:var(--c2)}
.pl-row{display:grid;grid-template-columns:16px minmax(110px,1fr) 56px 62px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--soft);font-size:13px;border-radius:8px}
.pl-row.click{cursor:pointer}.pl-row.click:hover{background:var(--soft)}.pl-row.on{background:var(--soft);outline:1px solid var(--cyan)}
.pl-row .r{text-align:right}.pl-head{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.pl-tot{font-weight:800;border-bottom:0;border-top:1px solid var(--line)}
.pl-sw{width:14px;height:14px;border-radius:4px;border:1px solid;opacity:.9;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ag-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.ag-tiles div{background:var(--p2);border:1px solid var(--l2);border-radius:10px;padding:8px 10px}.ag-tiles span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:700}.ag-tiles i{width:9px;height:9px;border-radius:3px;display:inline-block}.ag-tiles b{font-size:18px;font-weight:800}
/* ---------- tables ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.toolbar input{width:260px}.toolbar select{width:auto;padding:8px 10px}.grow{flex:1}
.tbox{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:560px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th,.tbl td{padding:9px 11px;border-bottom:1px solid var(--soft);text-align:left;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--th);color:var(--thtx);font-size:12px;font-weight:700;z-index:1;user-select:none}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--hovtx)}.tbl th .ar{opacity:.4;margin-left:3px}.tbl th.on .ar{opacity:1;color:var(--cyan)}
.tbl .r{text-align:right}.tbl td.wrap,.tbl th.wrap{white-space:normal;width:220px;min-width:180px;max-width:240px;overflow-wrap:anywhere;line-height:1.4}.tbl td{color:var(--tx2)}.tbl tbody tr:hover td{background:var(--hovrow)}.tbl tr.click{cursor:pointer}
.tbl tfoot td{position:sticky;bottom:0;background:var(--th);color:var(--text);font-weight:800;border-top:1px solid var(--line)}
.tbl .who b{color:var(--text)}.tbl .who small{display:block;color:var(--faint);font-size:11px}
.tbl .hl{color:var(--neg);font-weight:800}
.pb{display:inline-block;width:56px;height:5px;border-radius:9px;background:var(--track);vertical-align:middle;margin-left:6px;overflow:hidden}.pb i{display:block;height:100%}
.empty{color:var(--muted);padding:22px;text-align:center}
.pg{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}.pg div{display:flex;gap:6px}
.facts{display:grid;gap:0}.fact{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--soft);font-size:12.5px}.fact span{color:var(--muted)}.fact b{text-align:right;overflow-wrap:anywhere}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--track),var(--soft),var(--track));background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
/* ---------- modal + toast ---------- */
.modalbg{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:60}

.modal h3{font-size:17px;margin-bottom:8px}.modal p{margin:0 0 14px;color:var(--muted)}.modal.danger{border-color:rgba(255,112,129,.45)}.modal .lbl{margin-top:12px}
.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1;margin-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:70;box-shadow:0 10px 30px var(--shl);font-size:13px;max-width:90vw}.toast.bad{border-color:rgba(255,112,129,.5)}

/* sessions live in sessionStorage: closing the tab or browser signs the person out */
let store;try{sessionStorage.setItem("_t","1");sessionStorage.removeItem("_t");store=sessionStorage}catch(e){store=undefined}
const isRecovery=location.hash.includes("type=recovery");
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:store,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const redirectTo=location.origin+location.pathname;

/* ======================= helpers ======================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fm=m=>MN[+m.slice(5)-1]+" "+m.slice(2,4),fml=m=>MN[+m.slice(5)-1]+" "+m.slice(0,4),fd=d=>d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(0,4);
const pc=(a,b,d=1)=>b?(a/b*100).toFixed(d)+"%":"–";
const N=v=>Number(v||0).toLocaleString("en-IN");
const nice=v=>{if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
const niceInt=v=>Math.max(4,Math.ceil(nice(v)/4)*4);   // axis max that gives whole-number ticks
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fyOf=d=>{if(!d)return null;const y=+d.slice(0,4),m=+d.slice(5,7);return m>=4?y:y-1};
const fyLabel=s=>s==="all"?"All time":"FY "+s+"-"+String(s+1).slice(2);
const fyMonths=s=>[4,5,6,7,8,9,10,11,12].map(m=>s+"-"+pad(m)).concat([1,2,3].map(m=>(s+1)+"-"+pad(m)));
const pwOk=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);

/* ======================= source protection =======================
   Blocks the right-click menu and the view-source / save / developer-tools shortcuts.
   This only discourages casual copying. The real protection is the database's
   row-level security, which decides what each login can read. */
(function(){
 const editable=t=>!!(t&&t.closest&&t.closest("input,textarea,select,[contenteditable=true]"));
 document.addEventListener("contextmenu",e=>{if(!editable(e.target))e.preventDefault()},true);
 document.addEventListener("dragstart",e=>{if(e.target&&e.target.tagName==="IMG")e.preventDefault()},true);
 document.addEventListener("keydown",e=>{const c=e.code||"",k=(e.key||"").toLowerCase(),mod=e.ctrlKey||e.metaKey;
  const bad=k==="f12"||(mod&&!e.shiftKey&&(c==="KeyU"||c==="KeyS"))||(mod&&e.shiftKey&&["KeyI","KeyJ","KeyC","KeyS"].includes(c))||(e.metaKey&&e.altKey&&["KeyU","KeyI","KeyJ","KeyC"].includes(c));
  if(bad){e.preventDefault();e.stopPropagation()}},true);
})();

const authErr=m=>/jwt|expired|401/i.test(m||"");
async function enterApp(user){show("app");if(!S.user)guardHistory();S.user=user;S.email=(user.email||"").toLowerCase();bumpIdle();await loadApp()}
async function loadApp(){
 resetUI();
 const{data:me,error}=await sb.from("employees").select("emp_name,role,status,lwd").maybeSingle();
 if(error){if(authErr(error.message))return logoutNow("Your session has ended. Please sign in again.",false);$("ph").hidden=false;$("ph").textContent="Could not load your profile: "+error.message;return}
 if(me&&((me.status||"").trim().toLowerCase()!=="active"||(me.lwd&&me.lwd<today()))){await logoutNow("Your account is inactive.",false);inactiveModal();return}
 const role=(me?.role||"").trim().toUpperCase();
 if(!me||!(ADMIN.includes(role)||role in LVR)){$("who").textContent=S.email;$("ph").hidden=false;$("ph").textContent="Your account does not have dashboard access. Contact your administrator.";return}
 S.role=role;S.me=S.email;S.meName=me.emp_name||S.email;S.top=ADMIN.includes(role)?4:LVR[role];S.lock=ADMIN.includes(role)?-1:LVR[role];
 $("who").textContent=S.meName;$("whoSub").textContent=S.email+" · "+(role==="ADMIN"?"Administrator":role);
 if(!canOv()&&S.sec==="ov")S.sec="fce";
 side();$("dash").innerHTML='<div class="kpis">'+'<div class="skel" style="height:86px"></div>'.repeat(6)+'</div><div class="skel" style="height:300px"></div>';
 await loadData();
}
async function fetchAll(d){let all=[],from=0,cols=d.cols;for(;;){const{data,error}=await sb.from(d.table).select(cols).order("esc_date",{ascending:false,nullsFirst:false}).order("user_id").range(from,from+999);
 if(error){if(/extra/i.test(error.message||"")&&/(^|,)extra(,|$)/.test(cols)){cols=cols.replace(/(^|,)extra(?=,|$)/,"").replace(/^,/,"");all=[];from=0;continue}throw error}all=all.concat(data);if(data.length<1000)break;from+=1000}return all}
function prep(r,src){const sd=SRC[src],k=CLS[sd.cls](r);
 if(sd.kind==="money"&&!r.esc_date)return null;   // Refunds / Fintech count only rows with a Month
 const o={...r,src,k,m:(r.esc_date||"").slice(0,7),fy:fyOf(r.esc_date),product_category:r.product_category||"(blank)",user_id:r.user_id||""};
 if(sd.kind==="case"){o.res=RESOLVED[sd.cls](k);o.open=k==="pen";o.age=o.open&&r.esc_date?Math.max(0,Math.floor((Date.now()-new Date(r.esc_date))/864e5)):null;o.b=o.age==null?-1:o.age<=3?0:o.age<=7?1:o.age<=15?2:o.age<=30?3:4;if(sd.cls==="fce")o.escalation_category=r.escalation_category||"No Category Updated"}
 else{o.amt=Number(r.amount)||0;o.lender=sd.lender||"";o.aw=st(r.emi_confirmation)==="upcoming";o.emi_confirmation=r.emi_confirmation||"(blank)"}
 if(r.extra&&typeof r.extra==="object"){o.xn={};for(const[k,v]of Object.entries(r.extra))o.xn[nz(k)]=v}
 LV.forEach(j=>{if(o["l"+j]&&!o["l"+j+"_name"])o["l"+j+"_name"]=o["l"+j]});return o}
async function loadData(){
 const res=await Promise.all(Object.keys(SRC).map(async k=>{try{return[k,{rows:(await fetchAll(SRC[k])).map(r=>prep(r,k)).filter(Boolean)}]}catch(e){return[k,{rows:[],err:e.message||String(e),code:e.code}]}}));
 if(res.some(([,v])=>authErr(v.err)))return logoutNow("Your session has ended. Please sign in again.",false);
 S.data=Object.fromEntries(res);setSec(S.sec);
}
$("refresh").onclick=async()=>{const b=$("refresh");b.disabled=true;b.textContent="Refreshing…";await loadData();b.disabled=false;b.textContent="Refresh data";toast("Data refreshed.")};

const setupMsg=(d,t)=>isSetup(d)?t+" is not set up yet. Run the setup SQL in Supabase, then run the sync.":"Could not load "+t+": "+(d?.err||"");

function side(){

  if(!sub)return nb(id,t,ic);

  return`<button class="nv${S.sec===id?" on":""}${inside?" grp-on":""}" data-s="${id}" data-grp="1" type="button" aria-expanded="${open}" aria-controls="grp-${id}"${S.sec===id?' aria-current="page"':""}><span class="ic">${ic}</span><span>${t}</span><span class="cv" aria-hidden="true">›</span></button><div class="subs" id="grp-${id}"${open?"":" hidden"}>${sub.map(([i,n])=>nb(i,n,"",1)).join("")}</div>`}).join("");
}
$("side").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;const id=b.dataset.s;
 if(b.dataset.grp){if(S.sec===id){finOpen=!finOpen;side();return}finOpen=true}

function setSec(id){
 if(id==="ov"&&!canOv())id="fce";
 S.sec=id;side();S.cat="";S.catDim="";S.dim="";S.bk="";S.q="";S.page=1;S.note="";S.sort={k:"Date",dir:"desc"};
 $("ph").hidden=true;$("filt").hidden=true;$("dash").innerHTML="";$("kbar").innerHTML="";
 if(id==="ov"){ensurePeriod();$("filt").hidden=false;renderOv();return}
 const v=VIEWS[id];if(!v)return;
 const errs=v.src.filter(s=>S.data[s]?.err);
 if(errs.length===v.src.length){$("ph").hidden=false;$("ph").textContent=setupMsg(S.data[errs[0]],v.title);$("period").textContent=v.title;return}
 if(errs.length)S.note=errs.map(s=>setupMsg(S.data[s],"Fintech "+(SRC[s].lender||SRC[s].table))).join(" ")+" Showing the rest.";
 if(!viewRows(id).length){$("ph").hidden=false;$("ph").textContent=(S.note?S.note+" ":"")+"No "+v.title+" records are available for your access yet.";$("period").textContent=v.title;return}
 S.ds=id;ensurePeriod();$("filt").hidden=false;applySel(S.want,false);
}
const secName=id=>{for(const[i,t,,sub]of SEC){if(i===id)return t;for(const[j,n]of sub||[])if(j===id)return n}return""};

/* ======================= period: financial year + month grid ======================= */
const rowsOf=()=>S.sec==="ov"?Object.values(S.data).flatMap(d=>d.rows||[]):viewRows(S.ds);
function fysAvail(){return[...new Set(rowsOf().map(r=>r.fy).filter(v=>v!=null))].sort((a,b)=>b-a)}
function ensurePeriod(){const fys=fysAvail();
 if(S.fy!=="all"&&!fys.includes(S.fy)){S.fy=fys.length?fys[0]:"all";S.month=""}
 if(S.month&&!rowsOf().some(r=>r.m===S.month))S.month="";
}
const inPeriod=r=>S.fy==="all"||(r.fy===S.fy&&(!S.month||r.m===S.month));
const inYear=r=>S.fy==="all"||r.fy===S.fy;
function chartMonths(rows){if(S.fy!=="all")return fyMonths(S.fy);return[...new Set(rows.map(r=>r.m).filter(Boolean))].sort().slice(-12)}
const periodTxt=()=>S.fy==="all"?"All time":S.month?fml(S.month):fyLabel(S.fy)+" (full year)";
function drawPeriod(){

/* ======================= hierarchy (same rules as the Achievers dashboard) =======================
   - Levels above your own are hidden; your own level is locked to you.
   - Top-down: pick L4, then L3 under that L4, and so on. A level stays disabled until the one above is chosen.
   - "Direct (no L3)" lists cases where that level is blank; a level blank for everyone in view is skipped.
   - Lists only show people who have data in the selected period.
   - Your choice is kept across months and sections; when someone has no data, the nearest level above is shown. */
const match=(r,k,v)=>v===DIR?!r["l"+k]:r["l"+k]===v;
const selFilter=rows=>rows.filter(r=>LV.every(k=>!S.sel[k]||match(r,k,S.sel[k])));
function walk(sel){
 let pool=rowsOf().filter(inPeriod),ok=true,last=null,need=null,invalid=null;const out=[];
 for(const k of LV){
  if(k>S.top){out.push({k,st:"above"});continue}
  if(k===S.lock){out.push({k,st:"lock",last});last=k;continue}
  if(!ok){out.push({k,st:"wait",last,need});continue}
  const nm=new Map();let blank=0;pool.forEach(r=>{const e=r["l"+k];if(e){if(!nm.has(e))nm.set(e,r["l"+k+"_name"]||e)}else blank++});
  if(!nm.size){out.push({k,st:"pass",last});continue}
  const v=sel[k]||"",good=!v||(v===DIR?blank>0:nm.has(v));if(!good&&invalid==null)invalid=k;
  out.push({k,st:"open",last,opts:[...nm].sort((a,b)=>a[1].localeCompare(b[1])),dir:blank>0,v:good?v:""});
  if(v&&good){pool=pool.filter(r=>match(r,k,v));last=k}else{ok=false;need=k}
 }
 return{out,pool,invalid};
}
const optLabel=(o,v)=>v===DIR?"Direct (no L"+o.k+")":(new Map(o.opts).get(v)||v);
function applySel(want,remember){
 const s={};LV.forEach(k=>{if(want[k]&&k!==S.lock&&k<=S.top)s[k]=want[k]});
 let w=walk(s);
 for(let i=0;i<6&&w.invalid!=null;i++){const k=[0,1,2,3,4].find(j=>s[j]);if(k==null)break;delete s[k];w=walk(s)}
 S.sel={};w.out.forEach(o=>{if(o.st==="open"&&o.v)S.sel[o.k]=o.v});
 if(remember){S.want={...S.sel};S.wantLbl={};w.out.forEach(o=>{if(o.st==="open"&&o.v)S.wantLbl[o.k]=optLabel(o,o.v)})}
 S.page=1;render(w);
}
function pickLevel(k,v){const s={...S.sel};s[k]=v;LV.forEach(j=>{if(j<k)delete s[j]});applySel(s,true)}
$("hier").onchange=e=>{const k=e.target.dataset.k;if(k!=null)pickLevel(+k,e.target.value)};
function drawHier(w){
 $("hier").innerHTML=w.out.map(o=>{const k=o.k;if(o.st==="above")return"";
  if(o.st==="lock")return`<div class="f lock"><label class="lbl">L${k} (you)</label><select disabled aria-label="L${k} (you)"><option>${esc(S.meName)}</option></select></div>`;
  const lab=o.last==null?"L"+k:"L"+k+" under "+(o.last===S.lock?"you":"selected L"+o.last);
  if(o.st==="wait")return`<div class="f"><label class="lbl">${lab}</label><select disabled aria-label="${lab}"><option>Select L${o.need} first</option></select></div>`;
  if(o.st==="pass")return`<div class="f"><label class="lbl">${lab}</label><select disabled aria-label="${lab}"><option>No L${k} here (direct)</option></select></div>`;
  return`<div class="f"><label class="lbl" for="h${k}">${lab}</label><select id="h${k}" data-k="${k}"><option value="">All L${k} in view</option>${o.dir?`<option value="${DIR}"${o.v===DIR?" selected":""}>Direct (no L${k})</option>`:""}${o.opts.map(([e,n])=>`<option value="${esc(e)}"${o.v===e?" selected":""}>${esc(n)}</option>`).join("")}</select></div>`}).join("");
}
function drawCrumbs(w){

 w.out.forEach(o=>{if(o.st==="open"&&o.v){acc={...acc,[o.k]:o.v};parts.push({label:"L"+o.k+": "+optLabel(o,o.v),sel:{...acc}})}});

}

/* ======================= summary maths =======================
   First Call Escalation: Resolved vs Yet to resolve (blank status = yet to resolve).
   Onboarding Not Connected (base = Sales Bucketing): Pending = blank;
     Resolution % = (Onboarded + Ready + Refund) / Escalated Total; Pendency % = Pending / Escalated Total.
   Refunds (rows with a Month): Punched = all rows; Retained / Refunded by Refund Status; revenue = Sale Claim Amount;
     Retained % = Retained count / Punched count; Refunded % = Refunded count / Punched count.
   Fintech (rows with a Month): Loans Processed = all rows; Retained / Cancelled (FST) by Order Status; value = Order Amount;
     Cancelled % = FST count / Loans Processed count; Awaiting FST Cycle = EMI Confirmation "Upcoming".            */
function summ(rows){const s={n:rows.length,res:0,pen:0,ag:0,o7:0,o30:0,b:{}};
 rows.forEach(r=>{s.b[r.k]=(s.b[r.k]||0)+1;if(r.res)s.res++;if(r.open){s.pen++;s.ag+=r.age||0;if(r.age>7)s.o7++;if(r.age>30)s.o30++}});
 s.rp=s.n?s.res/s.n:0;s.pp=s.n?s.pen/s.n:0;s.avg=s.pen?s.ag/s.pen:null;return s}
function summM(rows){const s={n:rows.length,v:0,b:{},aw:0,awv:0};
 rows.forEach(r=>{s.v+=r.amt;const b=s.b[r.k]||(s.b[r.k]={n:0,v:0});b.n++;b.v+=r.amt;if(r.aw){s.aw++;s.awv+=r.amt}});
 ["ret","rfd","fst","oth"].forEach(k=>s[k]=s.b[k]||{n:0,v:0});return s}

/* ======================= breakdown dimensions =======================
   First Call: escalation category · Onboarding: team (next level down) · Refunds: Refund Bucketing · Fintech: lender */
const DIMGET={"x:refundbucketing":r=>{const v=X("Refund Bucketing","Refund Bucket")(r).trim();return v==="-"?"Retained":v}};   // "-" in Refund Bucketing = Retained
const dimVal=(r,d)=>DIMGET[d]?(DIMGET[d](r)||"(blank)"):d.startsWith("x:")?(String(r.xn?.[d.slice(2)]??"").trim()||"(blank)"):(r[d]||"(blank)");
function dimList(rows){
 if(S.ds==="fce")return[{k:"escalation_category",l:"Escalation category"}];
 if(S.ds==="onb")return[];
 if(S.ds!=="ref")return[{k:"lender",l:"Lender"}];
 /* Refunds: Refund Bucketing first (default), then any other short-list column of the tab */
 const out=[{k:"x:refundbucketing",l:"Refund Bucketing"}];
 if(rows.some(r=>r.product_category&&r.product_category!=="(blank)"))out.push({k:"product_category",l:"Product category"});
 const cnt={},lab={};rows.forEach(r=>{if(r.extra)for(const[k,x]of Object.entries(r.extra)){const n=nz(k);if(n==="refundbucketing"||n==="refundbucket"||/mobile|phone|number|empid|employeeid|userid|loanid|orderid|remark|email/.test(n))continue;lab[n]=k;const m=cnt[n]||(cnt[n]=new Map());m.set(x,(m.get(x)||0)+1)}});
 for(const[n,m]of Object.entries(cnt)){const filled=[...m.values()].reduce((a,b)=>a+b,0);if(m.size>=2&&m.size<=40&&filled>=rows.length*.3)out.push({k:"x:"+n,l:lab[n]})}
 return out}
/* Onboarding "By team": the level just below the deepest selection (or below you) */
function teamLevel(rows){let base=S.lock>=0?S.lock:5;LV.forEach(k=>{if(S.sel[k]&&k<base)base=k});for(let k=base-1;k>=0;k--)if(rows.some(r=>r["l"+k]))return k;return-1}
function teamBars(rows){const lv=teamLevel(rows);if(lv<0)return'<div class="empty">This is the lowest level. See the records below.</div>';
 const g=new Map();rows.forEach(r=>{const e=r["l"+lv]||DIR;let c=g.get(e);if(!c){c={e,name:e===DIR?"Direct (no L"+lv+")":r["l"+lv+"_name"]||e,n:0,a:0,o:0};g.set(e,c)}c.n++;if(r.res)c.a++;else if(r.open)c.o++});
 const L=[...g.values()].sort((a,b)=>b.o-a.o||b.n-a.n).slice(0,20),mx=Math.max(...L.map(c=>c.n));
 return`<p class="sub" style="margin:-4px 0 8px">One bar per L${lv}, most open first. Click a name to drill into their team.</p>`+L.map(c=>`<div class="hbar" data-pick="${lv}" data-pe="${esc(c.e)}" role="button" tabindex="0" title="${esc(c.name)}: ${c.a} resolved, ${c.o} open of ${c.n}"><span class="t">${esc(c.name)}</span><div class="bar"><i class="res" style="width:${c.a/mx*100}%"></i><i class="pen" style="width:${c.o/mx*100}%"></i></div><span class="num"><b>${N(c.o)}</b> open · ${pc(c.a,c.n,0)} resolved</span></div>`).join("")}
function drill(lv,email){const rows=S.f.filter(r=>(r["l"+lv]||DIR)===email),s={...S.sel};
 for(let j=lv+1;j<=S.top;j++){if(j===S.lock||s[j])continue;const c={};rows.forEach(r=>{const v=r["l"+j]||DIR;c[v]=(c[v]||0)+1});const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(best)s[j]=best[0]}
 s[lv]=email;LV.forEach(j=>{if(j<lv)delete s[j]});applySel(s,true)}

function trendChart(pts,o){
 if(!pts.some(p=>p.n))return'<div class="empty">No data for this selection.</div>';
 const fmt=o.fmt||(x=>N(Math.round(x)));
 const u="t"+(++UID),W=920,H=340,pl=62,pr=60,pt=30,pb=46,iw=W-pl-pr,ih=H-pt-pb,slot=iw/pts.length,bw=Math.min(26,slot*.3);
 const amtMax=nice(Math.max(1,...pts.map(p=>Math.max(p.a,p.b)))/0.58),bTop=pt+26,bBot=pt+ih*0.34;
 const yA=v=>pt+ih-(v/amtMax)*ih,yP=v=>bBot-v*(bBot-bTop);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Month-on-month chart"><defs>
  <linearGradient id="${u}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fdcff"/><stop offset=".55" stop-color="#2b8cff"/><stop offset="1" stop-color="#1747a8"/></linearGradient>
  <linearGradient id="${u}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset=".6" stop-color="#ff9a2e"/><stop offset="1" stop-color="#e2600c"/></linearGradient>
  <linearGradient id="${u}l" gradientUnits="userSpaceOnUse" x1="${pl}" y1="0" x2="${W-pr}" y2="0"><stop offset="0" stop-color="#4bd39a"/><stop offset=".5" stop-color="#34c5ff"/><stop offset="1" stop-color="#b18cff"/></linearGradient>
  <linearGradient id="${u}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34c5ff" stop-opacity=".22"/><stop offset="1" stop-color="#34c5ff" stop-opacity="0"/></linearGradient>
  <filter id="${u}g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 for(let g=0;g<=5;g++){const v=amtMax*g/5,y=yA(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(${g?"--ch-grid":"--ch-grid0"})" stroke-dasharray="${g?"3 5":"0"}"/><text x="${pl-10}" y="${y+4}" text-anchor="end" style="fill:var(--ch-ax)" font-size="11">${fmt(v)}</text>`}
 s+=`<line x1="${W-pr+4}" x2="${W-pr+4}" y1="${bTop}" y2="${bBot}" style="stroke:var(--ch-pct-line)"/>`;
 [0,.5,1].forEach(f=>{const y=bBot-f*(bBot-bTop);s+=`<line x1="${W-pr+1}" x2="${W-pr+7}" y1="${y}" y2="${y}" style="stroke:var(--ch-pct-line)"/><text x="${W-pr+11}" y="${y+4}" style="fill:var(--ch-pct)" font-size="11">${f*100}%</text>`});
 s+=`<text x="14" y="${pt+ih/2}" transform="rotate(-90 14 ${pt+ih/2})" text-anchor="middle" style="fill:var(--ch-ax2)" font-size="11">${esc(o.unit||"")}</text>`;
 const line=[];
 pts.forEach((p,i)=>{const cx=pl+slot*(i+.5),sel=p.m===S.month;
  if(sel)s+=`<rect x="${pl+slot*i+3}" y="${pt}" width="${slot-6}" height="${ih}" rx="8" style="fill:var(--ch-band);stroke:var(--ch-band-bd)"/>`;
  s+=`<g class="mo2"><title>${fml(p.m)}${p.n?" — "+esc(o.tip(p)):" — no data"}</title>`;
  if(p.n){const ha=Math.max(p.a?2:0,p.a/amtMax*ih),hb=Math.max(p.b?2:0,p.b/amtMax*ih),xa=cx-bw-2,xb=cx+2;
   s+=`<rect class="tb" x="${xa}" y="${pt+ih-ha}" width="${bw}" height="${ha}" rx="4" fill="url(#${u}r)"/><rect class="tb" x="${xb}" y="${pt+ih-hb}" width="${bw}" height="${hb}" rx="4" fill="url(#${u}o)"/>`+
    `<text x="${xa+bw/2}" y="${pt+ih-ha-6}" text-anchor="middle" style="fill:var(--ch-res)" font-size="10.5" font-weight="700">${fmt(p.a)}</text><text x="${xb+bw/2}" y="${pt+ih-hb-6}" text-anchor="middle" style="fill:var(--ch-pen)" font-size="10.5" font-weight="700">${fmt(p.b)}</text>`;
   line.push({x:cx,y:yP(p.p),v:p.p})}
  else s+=`<text x="${cx}" y="${pt+ih-8}" text-anchor="middle" style="fill:var(--ch-nodata)" font-size="10">No data</text>`;
  s+=`<text x="${cx}" y="${H-pb+20}" text-anchor="middle" style="fill:var(${sel?"--ch-mon-sel":p.n?"--ch-mon":"--ch-mon-na"})" font-size="12" font-weight="${sel?800:600}">${MN[+p.m.slice(5)-1].toUpperCase()}</text><text x="${cx}" y="${H-pb+34}" text-anchor="middle" style="fill:var(--ch-mon-na)" font-size="10">${p.m.slice(0,4)}</text>`;
  if(p.n&&S.fy!=="all")s+=`<rect class="hit" data-m="${p.m}" x="${pl+slot*i}" y="${pt}" width="${slot}" height="${ih+pb}"/>`;
  s+="</g>"});
 if(line.length){const d=line.map((q,i)=>(i?"L":"M")+q.x.toFixed(1)+" "+q.y.toFixed(1)).join(" ");
  if(line.length>1)s+=`<path d="${d} L${line[line.length-1].x.toFixed(1)} ${bBot} L${line[0].x.toFixed(1)} ${bBot} Z" fill="url(#${u}a)" pointer-events="none"/>`;
  s+=`<path d="${d}" fill="none" stroke="url(#${u}l)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#${u}g)" pointer-events="none"/>`;
  line.forEach(q=>{const lb=(q.v*100).toFixed(1)+"%",w=lb.length*7+14;s+=`<g pointer-events="none"><circle cx="${q.x}" cy="${q.y}" r="5.5" style="fill:var(--ch-pt);stroke:var(--cyan)" stroke-width="3"/><rect x="${q.x-w/2}" y="${q.y-32}" width="${w}" height="20" rx="10" style="fill:var(--ch-pill);stroke:var(--ch-pct-line)"/><text x="${q.x}" y="${q.y-18}" text-anchor="middle" style="fill:var(--ch-pill-tx)" font-size="11" font-weight="800">${lb}</text></g>`})}
 return s+"</svg>";
}

/* ---------- Achievers-style transparent 3D glass pie + legend ---------- */
function pieBlock(keys,rows,o){
 const tot=rows.length;if(!tot)return'<div class="empty">No records in this view.</div>';
 const groups=keys.map(b=>{const x=rows.filter(r=>r.k===b.k);return{...b,label:b.l,count:x.length,val:o.money?x.reduce((t,r)=>t+r.amt,0):0}}).filter(g=>g.count);
 const tv=groups.reduce((t,g)=>t+g.val,0),V=o.money?" v":"";
 return`<div class="paid-grid"><div class="pie3d fit">${pie3d(groups,tot)}</div><div>`+
  `<div class="pl-row pl-head${V}"><span></span><span>${esc(o.title)}</span><span class="r">Count</span><span class="r">Share</span>${o.money?'<span class="r">Amount</span>':""}</div>`+
  groups.map(g=>`<div class="pl-row click${V}${S.bk===g.k?" on":""}" data-bk="${g.k}" role="button" tabindex="0" title="Filter to ${esc(g.label)}"><i class="pl-sw" style="background:linear-gradient(180deg,${g.col[0]},${g.col[1]});border-color:${g.col[0]}"></i><span><span class="chip ${CHIP[g.k]}">${esc(g.label)}</span></span><b class="r num">${N(g.count)}</b><span class="r num">${pc(g.count,tot)}</span>${o.money?`<b class="r num" title="${esc(money(g.val))}">${moneyShort(g.val)}</b>`:""}</div>`).join("")+
  `<div class="pl-row pl-tot${V}"><span></span><span>Total</span><b class="r num">${N(tot)}</b><span class="r num">100%</span>${o.money?`<b class="r num" title="${esc(money(tv))}">${moneyShort(tv)}</b>`:""}</div></div></div>`;
}
function pie3d(groups,total){
 const W=700,H=330,cx=350,cy=136,rx=160,ry=82,dep=32,TAU=Math.PI*2,u="p"+(++UID);
 const P=(t,dy)=>(cx+rx*Math.cos(t)).toFixed(2)+" "+(cy+ry*Math.sin(t)+(dy||0)).toFixed(2);
 let defs=`<defs><filter id="${u}glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>`+
  `<linearGradient id="${u}gloss" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`+
  `<radialGradient id="${u}spec" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`+
  `<linearGradient id="${u}sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".22"/><stop offset=".42" stop-color="#fff" stop-opacity=".04"/><stop offset=".8" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`+
  `<clipPath id="${u}top"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath>`;
 let a=-Math.PI/2;const sl=[];
 groups.forEach((x,i)=>{const sp=TAU*x.count/total;sl.push({x,i,a,b:a+sp,m:a+sp/2});a+=sp;
  defs+=`<linearGradient id="${u}t${i}" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="${x.col[0]}" stop-opacity=".34"/><stop offset=".55" stop-color="${x.col[1]}" stop-opacity=".18"/><stop offset="1" stop-color="${x.col[2]}" stop-opacity=".44"/></linearGradient><linearGradient id="${u}s${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${x.col[1]}" stop-opacity=".3"/><stop offset="1" stop-color="${x.col[2]}" stop-opacity=".14"/></linearGradient>`});
 defs+="</defs>";
 const tip=x=>`<title>${esc(x.label)}: ${N(x.count)} (${(x.count/total*100).toFixed(1)}%)${x.val?" · "+esc(money(x.val)):""}</title>`;
 const wall=(s0,e0,i,x,op)=>`<path class="pwall" d="M${P(s0)} A${rx} ${ry} 0 0 1 ${P(e0)} L${P(e0,dep)} A${rx} ${ry} 0 0 0 ${P(s0,dep)} Z" fill="url(#${u}s${i})" fill-opacity="${op}" stroke="${x.col[0]}" stroke-opacity=".35" stroke-width=".8">${tip(x)}</path>`;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Split chart">`+defs;
 sl.forEach(q=>{s+=`<path d="M${cx} ${cy+dep+14} L${P(q.a,dep+14)} A${rx} ${ry} 0 ${(q.b-q.a)>Math.PI?1:0} 1 ${P(q.b,dep+14)} Z" fill="${q.x.col[1]}" opacity=".22" filter="url(#${u}glow)"/>`});
 s+=`<ellipse cx="${cx}" cy="${cy+dep}" rx="${rx}" ry="${ry}" style="fill:var(--glass-floor);stroke:var(--glass-floor-bd)" stroke-width="1"/>`;
 sl.forEach(q=>{[[-Math.PI/2,0],[Math.PI,1.5*Math.PI]].forEach(r=>{const s0=Math.max(q.a,r[0]),e0=Math.min(q.b,r[1]);if(s0<e0)s+=wall(s0,e0,q.i,q.x,.45)})});
 sl.forEach(q=>{const s0=Math.max(q.a,0),e0=Math.min(q.b,Math.PI);if(s0<e0)s+=wall(s0,e0,q.i,q.x,1)});
 s+=`<path d="M${P(0)} A${rx} ${ry} 0 0 1 ${P(Math.PI)} L${P(Math.PI,dep)} A${rx} ${ry} 0 0 0 ${P(0,dep)} Z" fill="url(#${u}sheen)" pointer-events="none"/><path d="M${P(0,dep)} A${rx} ${ry} 0 0 1 ${P(Math.PI,dep)}" fill="none" style="stroke:var(--glass-edge)" stroke-width="1.2" pointer-events="none"/>`;
 sl.forEach(q=>{if(sl.length>1&&Math.sin(q.a)>0.02){const p0=P(q.a).split(" "),p1=P(q.a,dep).split(" ");s+=`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}" style="stroke:var(--glass-edge)" stroke-width="1"/>`}});
 sl.forEach(q=>{s+=sl.length===1?`<ellipse class="ptop" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${u}t0)" stroke="${q.x.col[0]}" stroke-opacity=".9" stroke-width="1.4">${tip(q.x)}</ellipse>`
  :`<path class="ptop" d="M${cx} ${cy} L${P(q.a)} A${rx} ${ry} 0 ${(q.b-q.a)>Math.PI?1:0} 1 ${P(q.b)} Z" fill="url(#${u}t${q.i})" stroke="${q.x.col[0]}" stroke-opacity=".85" stroke-width="1.4" stroke-linejoin="round">${tip(q.x)}</path>`});
 s+=`<g clip-path="url(#${u}top)" pointer-events="none"><ellipse cx="${cx-rx*.2}" cy="${cy-ry*.5}" rx="${rx*.95}" ry="${ry*.58}" fill="url(#${u}gloss)"/><ellipse cx="${cx-rx*.42}" cy="${cy-ry*.42}" rx="${rx*.22}" ry="${ry*.12}" fill="url(#${u}spec)" opacity=".75"/></g><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" style="stroke:var(--glass-rim)" stroke-width="1.3" pointer-events="none"/>`;
 const L=[],R=[];
 sl.forEach(q=>{const c=Math.cos(q.m),sn=Math.sin(q.m),fr=sn>0;(c>=0?R:L).push({q,ax:cx+rx*.98*c,ay:cy+ry*.98*sn+(fr?dep*.55:0),y:cy+(ry+18)*sn+(fr?dep*.6:0),right:c>=0})});
 [L,R].forEach(list=>{list.sort((p,q)=>p.y-q.y);for(let k=1;k<list.length;k++)if(list[k].y-list[k-1].y<36)list[k].y=list[k-1].y+36;const over=list.length?list[list.length-1].y-(H-24):0;if(over>0)list.forEach(p=>p.y-=over);list.forEach(p=>{if(p.y<18)p.y=18})});
 L.concat(R).forEach(p=>{const x=p.q.x,ex=p.right?cx+rx+22:cx-rx-22,tx=ex+(p.right?10:-10),an=p.right?"start":"end",stl=`--c0:${x.col[0]};--c2:${x.col[2]}`;
  s+=`<polyline points="${p.ax.toFixed(1)},${p.ay.toFixed(1)} ${ex.toFixed(1)},${p.y.toFixed(1)} ${(ex+(p.right?6:-6)).toFixed(1)},${p.y.toFixed(1)}" fill="none" class="plab-l" style="${stl}" stroke-opacity=".85" stroke-width="1.2"/><circle cx="${p.ax.toFixed(1)}" cy="${p.ay.toFixed(1)}" r="2.8" class="plab" style="${stl}"/>`+
   `<text x="${tx.toFixed(1)}" y="${(p.y-3).toFixed(1)}" text-anchor="${an}" class="plab" style="${stl}" font-size="12.5" font-weight="800">${esc(x.label)}</text><text x="${tx.toFixed(1)}" y="${(p.y+12).toFixed(1)}" text-anchor="${an}" style="fill:var(--tx2)" font-size="11.5" font-weight="600">${N(x.count)} (${(x.count/total*100).toFixed(1)}%)${x.val?" · "+shortAmt(x.val):""}</text>`});
 return s+"</svg>";
}

/* ---------- aging: bucket tiles + stacked gradient columns by month raised ---------- */
const BL=["0-3 d","4-7 d","8-15 d","16-30 d","30+ d"],BCOL=[["#7ff0c0","#17a673"],["#8fe3ff","#1c97d6"],["#ffe08a","#e3a417"],["#ffc08a","#e2700c"],["#ff9aa8","#d23a52"]];
function agingBlock(f,yrRows,ms){
 const n=[0,0,0,0,0];f.forEach(r=>{if(r.open&&r.b>=0)n[r.b]++});
 let h=`<div class="ag-tiles">${n.map((v,i)=>`<div><span><i style="background:linear-gradient(180deg,${BCOL[i][0]},${BCOL[i][1]})"></i>${BL[i]}</span><b class="num">${N(v)}</b></div>`).join("")}</div>`;
 const by=ms.map(m=>{const c=[0,0,0,0,0];yrRows.forEach(r=>{if(r.m===m&&r.open&&r.b>=0)c[r.b]++});return c});
 if(!by.some(c=>c.some(Boolean)))return h+'<div class="empty">No open cases.</div>';
 const u="a"+(++UID),W=560,Hh=260,L=40,T=16,B=36,iw=W-L-10,ih=Hh-T-B,sl=iw/ms.length,bw=Math.min(24,sl*.58),mx=niceInt(Math.max(...by.map(c=>c.reduce((a,b)=>a+b,0)))),y=v=>T+ih-v/mx*ih;
 let s=`<svg viewBox="0 0 ${W} ${Hh}" class="agsvg" role="img" aria-label="Open cases by month raised and age"><defs>${BCOL.map((c,i)=>`<linearGradient id="${u}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`).join("")}</defs>`;
 for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${i?"--ch-grid":"--ch-grid0"})" stroke-dasharray="${i?"3 5":"0"}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ch-ax)" font-size="11">${Math.round(v)}</text>`}
 by.forEach((c,i)=>{const cx=L+sl*(i+.5),tot=c.reduce((a,b)=>a+b,0);let acc=0;
  c.forEach((v,j)=>{if(v){s+=`<rect x="${cx-bw/2}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" rx="${acc+v===tot?4:0}" fill="url(#${u}${j})"><title>${fml(ms[i])} · ${BL[j]}: ${v}</title></rect>`;acc+=v}});
  if(tot)s+=`<text x="${cx}" y="${y(tot)-5}" text-anchor="middle" style="fill:var(--ch-pen)" font-size="10" font-weight="700">${tot}</text>`;
  s+=`<text x="${cx}" y="${Hh-20}" text-anchor="middle" style="fill:var(--ch-mon)" font-size="11" font-weight="600">${MN[+ms[i].slice(5)-1].toUpperCase()}</text><text x="${cx}" y="${Hh-7}" text-anchor="middle" style="fill:var(--ch-mon-na)" font-size="9.5">${ms[i].slice(0,4)}</text>`});
 return h+s+'</svg><p class="sub">Each column is the month the case was raised; colours show how old those still-open cases are today.</p>';
}

/* ---------- horizontal bars (descending) ---------- */
function catBars(rows,cf){const g={};rows.forEach(r=>{const c=g[r[cf]]||(g[r[cf]]={a:0,o:0,n:0});c.n++;if(r.res)c.a++;else if(r.open)c.o++});
 const L=Object.entries(g).sort((a,b)=>b[1].n-a[1].n).slice(0,15);if(!L.length)return'<div class="empty">No data for this selection.</div>';const mx=Math.max(...L.map(([,c])=>c.n));
 return L.map(([n,c])=>`<div class="hbar${S.cat===n&&S.catDim===cf?" on":""}" data-c="${esc(n)}" data-dim="${cf}" role="button" tabindex="0" title="${esc(n)}: ${c.a} resolved, ${c.o} pending of ${c.n}"><span class="t">${esc(n)}</span><div class="bar"><i class="res" style="width:${c.a/mx*100}%"></i><i class="pen" style="width:${c.o/mx*100}%"></i></div><span class="num"><b>${N(c.n)}</b> · ${pc(c.a,c.n,0)} resolved</span></div>`).join("")}
function moneyBars(rows,dim,v){const g={};rows.forEach(r=>{const key=dimVal(r,dim),c=g[key]||(g[key]={n:0,v:0,a:0,b:0});c.n++;c.v+=r.amt;if(r.k===v.good)c.a++;else if(r.k===v.bad)c.b++});
 const L=Object.entries(g).sort((a,b)=>b[1].n-a[1].n).slice(0,15);if(!L.length)return'<div class="empty">No data for this selection.</div>';const mx=Math.max(...L.map(([,c])=>c.n));
 const ratio=c=>v.line==="good"?pc(c.a,c.n,0)+" "+v.goodL.toLowerCase():pc(c.b,c.n,0)+" cancelled";
 return L.map(([n,c])=>`<div class="hbar${S.cat===n&&S.catDim===dim?" on":""}" data-c="${esc(n)}" data-dim="${esc(dim)}" role="button" tabindex="0" title="${esc(n)}: ${c.n} · ${esc(money(c.v))} · ${v.goodL} ${c.a} · ${v.badL} ${c.b}"><span class="t">${esc(n)}</span><div class="bar"><i class="res" style="width:${c.a/mx*100}%"></i><i class="pen" style="width:${c.b/mx*100}%"></i></div><span class="num"><b>${N(c.n)}</b> · ${moneyShort(c.v)} · ${ratio(c)}</span></div>`).join("")}

   The filter panel and KPI scorecards stay pinned under the header. Once you scroll, they get
   smaller (tighter spacing, smaller text, KPIs in one row) but remain fully usable, so filters can
   be changed from anywhere. Changing a filter keeps you where you are on the page.
   Phones keep normal scrolling. */
let stuck=false;
const narrow=()=>!!(window.matchMedia&&matchMedia("(max-width:820px)").matches);
function layoutVars(){const top=document.querySelector(".top"),th=narrow()?0:(top?top.offsetHeight:0),root=document.documentElement.style;
 root.setProperty("--topH",th+"px");
 const fz=$("freeze"),fh=stuck&&fz?fz.offsetHeight:230;
 root.setProperty("--fitH",Math.max(260,innerHeight-th-fh-110)+"px")}
function unstick(){const fz=$("freeze");fz.classList.remove("stuck");fz.style.marginBottom="";stuck=false}
function checkStick(){const fz=$("freeze");if(!fz)return;
 if($("app").hidden||narrow()||$("filt").hidden){if(stuck)unstick();return}
 const th=parseFloat(document.documentElement.style.getPropertyValue("--topH"))||0,want=$("fs").getBoundingClientRect().top<th-4;
 if(want===stuck)return;
 if(want){const full=fz.offsetHeight;fz.classList.add("stuck");fz.style.marginBottom=Math.max(0,full-fz.offsetHeight)+"px";stuck=true}else unstick();
 layoutVars()}
addEventListener("scroll",checkStick,{passive:true});
addEventListener("resize",()=>{if(stuck)unstick();layoutVars();checkStick()});

/* ---------- speedometer gauge for a rate, with the target bands ---------- */
function gauge(m,v){
 const W=150,H=88,cx=75,cy=76,R=58,sw=11;let a,b;
 if(m.good==="high"){b=1;a=Math.min(.5,v==null?.5:Math.floor(v*10)/10)}else{a=0;b=Math.max(m.tgt[1]*3,v==null?0:Math.ceil(v*1.25*20)/20)}
 const T=x=>Math.min(1,Math.max(0,(x-a)/(b-a))),P=(t,r)=>[cx-(r||R)*Math.cos(Math.PI*t),cy-(r||R)*Math.sin(Math.PI*t)];
 const arc=(x1,x2,col,op)=>{const t1=T(x1),t2=T(x2);if(t2-t1<.001)return"";const p1=P(t1),p2=P(t2);return`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A${R} ${R} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${sw}"${op?` opacity="${op}"`:""}/>`};
 const G="#2fd49a",A="#ffbb3d",Rd="#ff6b80";
 let s=`<svg viewBox="0 0 ${W} ${H}" class="gauge" aria-hidden="true">`+arc(a,b,"var(--track)");
 s+=m.good==="high"?arc(a,m.tgt[1],Rd,.85)+arc(m.tgt[1],m.tgt[0],A,.9)+arc(m.tgt[0],b,G,.9):arc(a,m.tgt[0],G,.9)+arc(m.tgt[0],m.tgt[1],A,.9)+arc(m.tgt[1],b,Rd,.85);
 if(v!=null){const p=P(T(v),R-15);s+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" style="stroke:var(--text)" stroke-width="3" stroke-linecap="round"/>`}
 s+=`<circle cx="${cx}" cy="${cy}" r="6" style="fill:var(--text)"/><text x="${cx-R}" y="${H-1}" text-anchor="middle" style="fill:var(--faint)" font-size="9.5">${Math.round(a*100)}%</text><text x="${cx+R}" y="${H-1}" text-anchor="middle" style="fill:var(--faint)" font-size="9.5">${Math.round(b*100)}%</text>`;
 return s+"</svg>"}
function spark(vals,tone){const W=96,H=30,p=4,n=vals.length,pts=vals.map((v,i)=>v==null?null:[p+i*(W-2*p)/Math.max(1,n-1),H-p-v*(H-2*p)]).filter(Boolean);
 if(!pts.length)return"";const col=tone==="good"?"var(--green)":tone==="bad"?"var(--red)":tone==="warn"?"var(--amber)":"var(--cyan)",last=pts[pts.length-1];
 return`<svg viewBox="0 0 ${W} ${H}" class="spark" aria-hidden="true"><polyline points="${pts.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${col}"/></svg>`}
function modCard(m,ref){
 if(!modReady(m.v))return`<div class="mcard off"><div class="mh"><span>${m.ic}</span>${m.t}</div><p class="sub">Not set up yet</p></div>`;
 const all=scopeRows(m.v),s=sumOf(m,all.filter(inPeriod)),r=m.rate(s),t=toneOf(m,r);
 const months=[];if(ref){let x=ref;for(let i=0;i<6;i++){months.unshift(x);x=prevMonth(x)}}
 const cur=ref?rateIn(m,all,ref):null,prv=ref?rateIn(m,all,prevMonth(ref)):null;
 let d='<span class="chip n">No previous month</span>';
 if(cur!=null&&prv!=null){const dd=(cur-prv)*100,flat=Math.abs(dd)<.05,better=m.good==="high"?dd>0:dd<0;
  d=`<span class="chip ${flat?"n":better?"g":"r"}">${flat?"■ 0.0":(dd>0?"▲ ":"▼ ")+Math.abs(dd).toFixed(1)} pp</span><small>${MN[+ref.slice(5)-1]} vs ${MN[+prevMonth(ref).slice(5)-1]}</small>`}
 const tg=m.good==="high"?`target ≥ ${m.tgt[0]*100}%`:`target ≤ ${m.tgt[0]*100}%`;
 return`<div class="mcard ${t}" data-ovgo="${m.v}" role="button" tabindex="0" title="Open ${esc(m.t)}"><div class="mh"><span>${m.ic}</span>${m.t}</div>`+
  `<div class="mg">${gauge(m,r)}<div class="mv"><b class="num">${r==null?"–":pp(r)}</b><span>${m.rateL}</span><small>${tg}</small></div></div>`+
  `<div class="md">${d}<span class="grow"></span><span class="spk" title="Last 6 months">${spark(months.map(mm=>rateIn(m,all,mm)),t)}</span></div><small>${m.sub(s)}</small></div>`}

/* ---------- needs attention: every point names the manager behind it ---------- */
function insights(ref){const out=[],add=(t,x)=>out.push({t,x}),lv=mgrLvl(),who="L"+lv;
 const tail=(tm,unit,fmtw)=>tm&&tm.many?` Highest: ${B(tm.name)} with ${fmtw?fmtw(tm.w):N(tm.w)} ${unit} (${pp(tm.share)}).`:tm&&!tm.many&&tm.e!==DIR?` All under ${B(tm.name)}.`:"";
 MODS.forEach(m=>{if(!modReady(m.v))return;const all=scopeRows(m.v);if(!all.length)return;
  if(ref){const c=rateIn(m,all,ref),p=rateIn(m,all,prevMonth(ref));if(c!=null&&p!=null){const dd=(c-p)*100,worse=m.good==="high"?dd<0:dd>0;
   if(Math.abs(dd)>=3){
    const ms=byMgr(all.filter(r=>r.m===ref||r.m===prevMonth(ref))).map(x=>{const a=x.rows.filter(r=>r.m===ref),b=x.rows.filter(r=>r.m===prevMonth(ref));return a.length>=2&&b.length>=2?{...x,c:m.rate(sumOf(m,a)),p:m.rate(sumOf(m,b))}:null}).filter(Boolean)
     .map(x=>({...x,d:(x.c-x.p)*(m.good==="high"?1:-1)})).sort((a,b)=>worse?a.d-b.d:b.d-a.d);
    const mv=ms[0]&&(worse?ms[0].d<0:ms[0].d>0)?` Biggest ${worse?"drop":"gain"}: ${B(ms[0].name)} (${pp(ms[0].p)} → ${pp(ms[0].c)}).`:"";
    add(worse?"bad":"good",`${esc(m.t)}: ${m.rateL} ${worse?"worsened":"improved"} by ${Math.abs(dd).toFixed(1)} pp in ${fml(ref)} (${pp(p)} → ${pp(c)}).${mv}`)}}}
  const rk=byMgr(all.filter(inPeriod)).filter(x=>x.e!==DIR&&x.n>=3).map(x=>({...x,r:m.rate(sumOf(m,x.rows))})).sort((a,b)=>m.good==="high"?a.r-b.r:b.r-a.r);
  if(rk.length>1){const w=rk[0],t=toneOf(m,w.r);if(t!=="good")add(t,`${esc(m.t)}: weakest ${who} is ${B(w.name)} at ${pp(w.r)} ${m.rateL.toLowerCase()} (${N(w.n)} cases).`)}
 });
 const fc=scopeRows("fce").filter(inPeriod),o30=fc.filter(r=>r.open&&r.age>30);
 if(o30.length)add("bad",`${N(o30.length)} first-call escalation(s) have been open for more than 30 days.`+tail(topMgr(o30),"cases"));
 const on=scopeRows("onb").filter(inPeriod),oo=on.filter(r=>r.open);
 if(oo.length)add(oo.length/on.length>.1?"bad":"warn",`${N(oo.length)} onboarding case(s) are still open (${pc(oo.length,on.length,1)} open).`+tail(topMgr(oo),"open"));
 const rf=scopeRows("ref").filter(inPeriod),rd=rf.filter(r=>r.k==="rfd"),rt=rf.reduce((t,r)=>t+r.amt,0),rdv=rd.reduce((t,r)=>t+r.amt,0);
 if(rd.length)add("warn",`${moneyShort(rdv)} refunded across ${N(rd.length)} case(s), ${pc(rdv,rt,1)} of punched revenue.`+tail(topMgr(rd,r=>r.amt),"refunded",moneyShort));
 const ru=rf.filter(r=>r.k==="oth");if(ru.length)add("warn",`${N(ru.length)} refund case(s) have no Refund Status yet.`+tail(topMgr(ru),"cases"));
 const fr=scopeRows("fin").filter(inPeriod),fs=fr.filter(r=>r.k==="fst");
 if(fs.length)add(fs.length/fr.length>.07?"bad":"warn",`${N(fs.length)} loan(s) worth ${moneyShort(fs.reduce((t,r)=>t+r.amt,0))} were cancelled (FST), ${pc(fs.length,fr.length,1)} of loans.`+tail(topMgr(fs),"cancellations"));
 const aw=fr.filter(r=>r.aw);if(aw.length)add("warn",`${N(aw.length)} loan(s) worth ${moneyShort(aw.reduce((t,r)=>t+r.amt,0))} are awaiting the FST cycle.`+tail(topMgr(aw),"loans"));
 const lb=["baj","fib"].map(k=>{const x=fr.filter(r=>r.src===k);return{l:SRC[k].lender,n:x.length,c:x.length?x.filter(r=>r.k==="fst").length/x.length:0}}).filter(x=>x.n>=3);
 if(lb.length===2&&Math.abs(lb[0].c-lb[1].c)>=.02){const hi=lb[0].c>lb[1].c?lb[0]:lb[1],lo=hi===lb[0]?lb[1]:lb[0];add("warn",`Fintech: ${B(hi.l)} cancels ${pp(hi.c)} of loans vs ${pp(lo.c)} for ${esc(lo.l)}.`)}
 const ord={bad:0,warn:1,good:2};return out.sort((a,b)=>ord[a.t]-ord[b.t]).slice(0,10)}

 ms.forEach((mm,i)=>{const tip=series.map(({m,v})=>`${m.t}: ${v[i]==null?"no data":pp(v[i])}`).join("\n");s+=`<rect class="hit" ${S.fy!=="all"?`data-m="${mm}"`:""} x="${pl+sl*i}" y="${pt}" width="${sl}" height="${ih+pb}" style="fill:transparent${S.fy!=="all"?";cursor:pointer":""}"><title>${fml(mm)}\n${esc(tip)}</title></rect>`});

/* ---------- open backlog by age, per module ---------- */
const AB=["≤ 30 d","31–60 d","61–90 d","90+ d"],ACOL=[["#8fe3ff","#1c97d6"],["#ffe08a","#e3a417"],["#ffc08a","#e2700c"],["#ff9aa8","#d23a52"]];
const abOf=a=>a==null?-1:a<=30?0:a<=60?1:a<=90?2:3;
function backlogBlock(){
 const rows=MODS.filter(m=>modReady(m.v)).map(m=>{const x=scopeRows(m.v).filter(inPeriod).filter(BACK[m.v].f),c=[0,0,0,0];x.forEach(r=>{const b=abOf(ageOf(r));if(b>=0)c[b]++});return{m,n:x.length,c,old:topMgr(x.filter(r=>abOf(ageOf(r))>=2))}});
 if(!rows.some(r=>r.n))return'<div class="empty">No open backlog. 🎉</div>';
 const mx=Math.max(...rows.map(r=>r.n))||1;
 return`<div class="bk-leg">${AB.map((l,i)=>`<span><i style="background:linear-gradient(90deg,${ACOL[i][1]},${ACOL[i][0]})"></i>${l}</span>`).join("")}</div>`+rows.map(r=>`<div class="bk" data-ovgo="${r.m.v}" role="button" tabindex="0" title="Open ${esc(r.m.t)}"><div class="bk-h"><span>${r.m.ic} <b>${esc(r.m.t)}</b> · ${BACK[r.m.v].l}</span><b class="num">${N(r.n)}</b></div>`+
  `<div class="bar big" style="width:${Math.max(4,r.n/mx*100)}%">${r.c.map((v,i)=>v?`<i style="width:${v/r.n*100}%;background:linear-gradient(90deg,${ACOL[i][1]},${ACOL[i][0]})" title="${AB[i]}: ${N(v)}"></i>`:"").join("")}</div>`+
  `<small>${r.c.map((v,i)=>v?`${AB[i]}: ${N(v)}`:"").filter(Boolean).join(" · ")||"–"}${r.old&&r.old.e!==DIR?` · oldest backlog with <b>${esc(r.old.name)}</b> (${N(r.old.w)} over 60 d)`:""}</small></div>`).join("")}

/* ---------- donut: who holds the open backlog (manager level) ---------- */
const DCOL=["#34c5ff","#a184ff","#2fd49a","#ffbb3d","#ff6b80","#4a98f0","#8fa8c2"];
function donutBlock(){
 const all=MODS.filter(m=>modReady(m.v)).flatMap(m=>scopeRows(m.v).filter(inPeriod).filter(BACK[m.v].f).map(r=>({...r,_m:m.v})));
 if(!all.length)return'<div class="empty">No open backlog. 🎉</div>';
 const L=byMgr(all).sort((a,b)=>b.n-a.n),top=L.slice(0,6),rest=L.slice(6),parts=top.map((x,i)=>({l:x.name,e:x.e,n:x.n,rows:x.rows,c:DCOL[i]})).concat(rest.length?[{l:`Others (${rest.length})`,n:rest.reduce((t,x)=>t+x.n,0),rows:rest.flatMap(x=>x.rows),c:DCOL[6]}]:[]);
 const tot=all.length,r=62,C=2*Math.PI*r;let off=0,seg="";
 parts.forEach(p=>{const l=p.n/tot*C;seg+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.c}" stroke-width="24" stroke-dasharray="${Math.max(0,l-1.5).toFixed(2)} ${(C-l+1.5).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(p.l)}: ${N(p.n)} (${pc(p.n,tot,1)})</title></circle>`;off+=l});
 const mix=p=>MODS.map(m=>{const k=p.rows.filter(x=>x._m===m.v).length;return k?`${m.ic} ${N(k)}`:""}).filter(Boolean).join("  ");
 return`<div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="Open backlog by manager"><circle cx="90" cy="90" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="24"/>${seg}<text x="90" y="88" text-anchor="middle" style="fill:var(--text)" font-size="26" font-weight="800">${N(tot)}</text><text x="90" y="106" text-anchor="middle" style="fill:var(--muted)" font-size="11">open items</text></svg>`+
  `<div class="dl">${parts.map(p=>`<div><i style="background:${p.c}"></i><span><b>${esc(p.l)}</b><small>${mix(p)}</small></span><b class="num">${N(p.n)}</b><span class="num">${pc(p.n,tot,0)}</span></div>`).join("")}</div></div>`}

/* ---------- waterfall: where the value went ---------- */
function waterfall(steps,ready){
 if(!ready)return'<div class="empty">Not set up yet.</div>';
 const tot=steps[0].v;if(!tot)return'<div class="empty">No value in this period.</div>';
 const u="w"+(++UID),W=460,H=250,L=56,T=26,Bt=40,iw=W-L-10,ih=H-T-Bt,sl=iw/steps.length,bw=Math.min(60,sl*.6),mx=nice(tot),y=v=>T+ih-v/mx*ih;
 const GR={total:["#6fdcff","#1747a8"],neg:["#ff9aa8","#d23a52"],grey:["#dce8f5","#5b7590"],end:["#9dffd5","#18a06f"]};
 let s=`<svg viewBox="0 0 ${W} ${H}" class="agsvg" role="img" aria-label="Value waterfall"><defs>${Object.entries(GR).map(([k,c])=>`<linearGradient id="${u}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient>`).join("")}</defs>`;
 for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${i?"--ch-grid":"--ch-grid0"})" stroke-dasharray="${i?"3 5":"0"}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ch-ax)" font-size="10.5">${shortAmt(v)}</text>`}
 let lvl=tot;steps.forEach((st,i)=>{const cx=L+sl*(i+.5);let top,bot,lab;
  if(st.t==="total"){top=tot;bot=0;lab=shortAmt(tot)}else if(st.t==="end"){top=st.v;bot=0;lab=shortAmt(st.v)}else{top=lvl;bot=lvl-st.v;lvl=bot;lab="−"+shortAmt(st.v)}
  const h=Math.max(st.v?2:0,y(bot)-y(top));
  s+=`<rect x="${cx-bw/2}" y="${y(top)}" width="${bw}" height="${h}" rx="4" fill="url(#${u}${st.c||st.t})"><title>${esc(st.l)}: ${esc(money(st.v))} (${pc(st.v,tot,1)})</title></rect>`;
  if(i<steps.length-1){const nx=st.t==="total"?tot:st.t==="end"?st.v:bot;s+=`<line x1="${cx+bw/2}" x2="${cx+sl-bw/2}" y1="${y(nx)}" y2="${y(nx)}" style="stroke:var(--ch-grid0)" stroke-dasharray="3 3"/>`}
  s+=`<text x="${cx}" y="${y(top)-6}" text-anchor="middle" style="fill:var(--text)" font-size="11" font-weight="800">${lab}</text><text x="${cx}" y="${H-22}" text-anchor="middle" style="fill:var(--ch-mon)" font-size="11" font-weight="600">${esc(st.l)}</text><text x="${cx}" y="${H-8}" text-anchor="middle" style="fill:var(--ch-mon-na)" font-size="10">${pc(st.v,tot,0)}</text>`});
 return s+"</svg>"}
function waterfalls(){
 const rf=summM(scopeRows("ref").filter(inPeriod)),fn=summM(scopeRows("fin").filter(inPeriod));
 const a=[{l:"Punched",v:rf.v,t:"total"},{l:"Refunded",v:rf.rfd.v,t:"neg"}].concat(rf.oth.v?[{l:"Not updated",v:rf.oth.v,t:"neg",c:"grey"}]:[],[{l:"Retained",v:rf.ret.v,t:"end"}]);
 const b=[{l:"Processed",v:fn.v,t:"total"},{l:"FST",v:fn.fst.v,t:"neg"}].concat(fn.oth.v?[{l:"Other",v:fn.oth.v,t:"neg",c:"grey"}]:[],[{l:"Retained",v:fn.ret.v,t:"end"}]);
 return`<div class="g2">`+panel("Refunds value waterfall","Punched revenue (Sale Claim Amount) down to what was retained.",`<div class="fit">${waterfall(a,modReady("ref"))}</div>`)+

/* L4 scorecard heatmap: one row per person at your level, key metrics colour-coded */
const HM=[{v:"fce",l:"Resolution %",rate:1},{v:"fce",l:"Open",get:s=>s.pen},{v:"onb",l:"Resolution %",rate:1},{v:"onb",l:"Open",get:s=>s.pen},
 {v:"ref",l:"Retained %",rate:1},{v:"ref",l:"Refunded ₹",get:s=>s.rfd.v,money:1},{v:"fin",l:"Cancelled %",rate:1},{v:"fin",l:"Awaiting FST",get:s=>s.aw}];
function heatmap(){
 const lvl=ovLevel(),groups=new Map();
 MODS.forEach(m=>scopeRows(m.v).filter(inPeriod).forEach(r=>{const e=r["l"+lvl]||DIR;if(!groups.has(e))groups.set(e,{e,name:e===DIR?"(No L"+lvl+" mapped)":r["l"+lvl+"_name"]||e,by:{}});const g=groups.get(e);(g.by[m.v]||(g.by[m.v]=[])).push(r)}));
 if(!groups.size)return'<div class="empty">No records for '+esc(periodTxt())+'.</div>';
 const val=(by,c)=>{const rows=by[c.v]||[];if(!rows.length)return null;const m=modOf(c.v),s=sumOf(m,rows);return c.rate?m.rate(s):c.get(s)};
 const list=[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name));
 const tot={};MODS.forEach(m=>tot[m.v]=scopeRows(m.v).filter(inPeriod));
 const mx=HM.map(c=>c.rate?1:Math.max(0,...list.map(g=>val(g.by,c)||0)));
 const cell=(c,v,i,attrs)=>{if(v==null)return`<td class="r hmx">–</td>`;let bg,txt;
  if(c.rate){const t=toneOf(modOf(c.v),v);bg=t==="good"?"rgba(23,135,92,.20)":t==="warn"?"rgba(214,140,20,.24)":"rgba(201,48,72,.24)";txt=pp(v)}
  else{const a=mx[i]?v/mx[i]:0;bg=v?`rgba(201,48,72,${(.06+a*.34).toFixed(2)})`:"transparent";txt=c.money?moneyShort(v):N(v)}
  return`<td class="r num hmc" style="background:${bg}"${attrs}>${txt}</td>`};
 const head1=`<tr><th rowspan="2">L${lvl}${lvl===4?" · Regional Head":""}</th>${MODS.map(m=>`<th colspan="2" class="hmg" style="border-bottom:2px solid ${MCOL[m.v][1]}">${m.ic} ${m.t}</th>`).join("")}</tr>`;
 const head2=`<tr>${HM.map(c=>`<th class="r">${c.l}</th>`).join("")}</tr>`;
 const body=list.map(g=>`<tr><td class="who"><b>${esc(g.name)}</b>${g.e!==DIR?`<small>${esc(g.e)}</small>`:""}</td>${HM.map((c,i)=>cell(c,val(g.by,c),i,(g.e===DIR&&S.lock>=0)?"":` data-hv="${c.v}" data-he="${esc(g.e)}" data-hn="${esc(g.name)}" tabindex="0" role="button" title="Open ${esc(modOf(c.v).t)} for ${esc(g.name)}"`)).join("")}</tr>`).join("");
 const foot=`<tr><td>Overall</td>${HM.map((c,i)=>{const v=val(tot,c);return v==null?'<td class="r">–</td>':`<td class="r num">${c.rate?pp(v):c.money?moneyShort(v):N(v)}</td>`}).join("")}</tr>`;
 return`<div class="tbox hm" style="max-height:none"><table class="tbl"><thead>${head1}${head2}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`}

function renderOv(){
 const y0=window.scrollY;
 ensurePeriod();drawPeriod();$("hier").innerHTML="";$("crumbs").innerHTML="";$("selNote").hidden=true;$("act").innerHTML="";$("kbar").innerHTML="";
 const lvl=ovLevel(),ml=mgrLvl(),ref=refMonth(),roleTxt=S.role==="ADMIN"?"Administrator":S.role;
 const ms=chartMonths(MODS.flatMap(m=>scopeRows(m.v)));
 const ins=insights(ref);
 const legend=MODS.filter(m=>modReady(m.v)).map(m=>`<span><i class="sw" style="background:${MCOL[m.v][1]};height:4px;width:22px;vertical-align:3px"></i>${m.t} · ${m.rateL}${m.good==="low"?" (dashed, lower is better)":""}</span>`).join("");
 $("dash").innerHTML=
  `<section class="panel focus slim"><div><div class="sub">${esc(periodTxt())} · Management view</div><h2>${esc(S.meName)}</h2></div><div class="chips"><span class="chip">${esc(roleTxt)}</span><span class="chip p">Summary at L${lvl} level</span>${S.lock<0?'<span class="chip n">All teams</span>':'<span class="chip n">Your team only</span>'}${ref?`<span class="chip n">Month-on-month: ${fml(ref)} vs ${fml(prevMonth(ref))}</span>`:""}</div></section>`+
  `<div class="mcards">${MODS.map(m=>modCard(m,ref)).join("")}</div>`+
  `<div class="g2">`+panel("Key rates by month",(S.fy==="all"?"Latest 12 months with data.":"Every month of "+fyLabel(S.fy)+". Click a month to filter.")+" Hover a month for all four values.",`<div class="trend-legend">${legend}</div><div class="fit">${rateChart(ms)}</div>`)+
  panel("Needs attention",`For ${esc(periodTxt())}, with the L${ml} manager behind each point.`,ins.length?`<ul class="insights">${ins.map(i=>`<li><span class="dot ${i.t}"></span><span>${i.x}</span></li>`).join("")}</ul>`:'<div class="empty">Nothing needs attention right now. 🎉</div>')+`</div>`+
  panel(`L${lvl} scorecard`,`Key metrics side by side for ${esc(periodTxt())}. Green / amber / red follow the targets; counts and amounts get redder as they grow. Click a cell to open that module for that person.`,heatmap())+
  `<div class="g2">`+panel("Open backlog by age","Items still open in each module, by days since the case month. Click a module to open it.",backlogBlock())+
  panel(`Who holds the open backlog`,`All open items across the four modules, by L${ml} manager.`,donutBlock())+`</div>`+
  waterfalls()+
  `<h2 class="sec-h">Team Level Escalations Summary</h2>`+
  OV.map(([v,t])=>`<section class="panel"><div class="block-h"><div><h2>${t}</h2><p class="sub">One row per L${lvl}, ${esc(periodTxt())}. ${OVSUB[v]} Click a row to open its dashboard.</p></div></div>${ovTable(v)}</section>`).join("");
 afterRender(y0);
}
function ovOpen(view,email,name){const lvl=ovLevel();
 if(email&&lvl!==S.lock){S.want={[lvl]:email};S.wantLbl={[lvl]:name||email}}
 if(view==="fin")finOpen=true;
 setSec(view);if(email&&lvl!==S.lock&&S.ds===view)applySel(S.want,true);window.scrollTo({top:0,behavior:"smooth"})}
function ovClick(e){
 const card=e.target.closest("[data-ovgo]");if(card){ovOpen(card.dataset.ovgo);return}
 const hc=e.target.closest("[data-hv]");if(hc){ovOpen(hc.dataset.hv,hc.dataset.he,hc.dataset.hn);return}
 const m=e.target.closest("[data-m]");if(m){setMonth(S.month===m.dataset.m?"":m.dataset.m);return}
 const th=e.target.closest("th[data-ok]");if(th){const so=S.ovSort[th.dataset.ok],k=th.dataset.k;if(so.k===k)so.dir=so.dir==="desc"?"asc":"desc";else{so.k=k;so.dir=k==="name"?"asc":"desc"}renderOv();return}
 const tr=e.target.closest("tr[data-go]");if(!tr||!tr.classList.contains("click"))return;
 const view=tr.dataset.go,x=S.ovRows[view][+tr.dataset.i];ovOpen(view,x.e,x.name);
}
